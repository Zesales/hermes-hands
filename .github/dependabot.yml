version: 2
updates:
  # The GitHub Actions the workflows use, pinned by commit (`@<sha> # vX.Y.Z`):
  # a PR when one has a newer release — never before that release is 14 days
  # old. The PR only proposes; review it like any other — close one that
  # offers a new major / minor .0 without a patch yet: Dependabot comes back
  # with the next release of it. Go modules are not watched: they are
  # vendored and updated on purpose.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    labels:
      - "bump:patch" # every merged PR is a release — an Actions bump is a patch
    commit-message:
      prefix: ci
