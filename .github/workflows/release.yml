name: release

# Every push to `main` — i.e. every merged PR — builds all targets and
# publishes a GitHub Release  v<VERSION>-<sha>  (unique per commit). GitHub's
# "latest" follows the newest, so `install.sh` with no args always gets it;
# `install.sh --version <VERSION>-<sha>` pins one exactly.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -mod=vendor   # deps are vendored; CI never touches the network
    steps:
      # actions/checkout v4.2.2, pinned by commit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # actions/setup-go v7.0.0, pinned by commit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.7'   # exact, must equal go.mod
          check-latest: false

      - name: Version + tag
        id: v
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          case "$v" in ''|*[!0-9.]*) echo "::error::VERSION '$v' is not X.Y.Z"; exit 1 ;; esac
          sha=$(git rev-parse --short=7 HEAD)
          echo "tag=v$v-$sha" >> "$GITHUB_OUTPUT"

      - name: Verify
        run: |
          bad=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          test -z "$bad" || { echo "gofmt needed on:"; echo "$bad"; exit 1; }
          go vet ./...
          go test ./...

      - name: Build
        run: ./build.sh release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.v.outputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already released — nothing to do"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" \
            --title "$tag" \
            --latest \
            --notes "Automated build of \`main\` @ $(git rev-parse --short HEAD). Changes: see CHANGELOG.md." \
            dist/hermes-hands_* dist/SHA256SUMS
