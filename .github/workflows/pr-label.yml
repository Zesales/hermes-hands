name: pr-label

# Enforces the version bump for release.yml: every PR must carry exactly one of
#   bump:patch  bump:minor  bump:major   -> that bump, then a release on merge
# Every merged PR is a release — there is no "no release" label.
# Make the `bump-label` job a required status check so a PR can't merge without
# a decision. Re-runs when labels change (labeled / unlabeled).
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

# It reads only the event's label list — no token rights needed.
permissions: {}

jobs:
  bump-label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: exactly one bump label
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          n=0; found=
          for l in patch minor major; do
            case " $LABELS " in *" bump:$l "*) n=$((n + 1)); found="$found bump:$l" ;; esac
          done
          if [ "$n" != 1 ]; then
            echo "::error::this PR needs exactly one of: bump:patch  bump:minor  bump:major  (found:$found)"
            exit 1
          fi
          echo "ok ->$found"
