name: test

# PR-only, on open + every push to the PR branch (synchronize). NOT `on: push`
# as well — that double-fires when a branch with an open PR is pushed. Not on
# `main`: release.yml does not re-test (the merged code is what this run
# verified). The `test` job is the required status check for merging.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -mod=vendor   # deps are vendored; CI never touches the network
    steps:
      # actions/checkout v4.2.2, pinned by commit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-go v7.0.0, pinned by commit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.7'   # exact, must equal go.mod
          check-latest: false
      - name: gofmt
        run: |
          bad=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          test -z "$bad" || { echo "gofmt needed on:"; echo "$bad"; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      # The exact build release.yml runs after a merge (linux+darwin ×
      # amd64+arm64 + SHA256SUMS), minus the publish — so a green `test`
      # guarantees the release build will succeed and release.yml can skip
      # re-testing.
      - name: Build the release targets
        run: ./build.sh release
      # Not shipped (native Windows has no bash for `shell`), but keep it
      # compiling so a contributor's build tags don't rot.
      - name: Windows compiles
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
