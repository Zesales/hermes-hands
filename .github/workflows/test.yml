name: test

# PR-only, on open + every push to the PR branch (synchronize). NOT `on: push`
# as well — that double-fires when a branch with an open PR is pushed. Not on
# `main`: release.yml does not re-test (the merged code is what this run
# verified). The `test` job is the required status check for merging.
on:
  pull_request:

# Read-only token: the gate reads the code and never writes — release.yml
# carries its own contents: write.
permissions:
  contents: read

# A newer push to the same PR replaces the run still in flight.
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2, pinned by commit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # The Go toolchain is the pinned container from the Makefile (GO_IMAGE,
      # must equal go.mod) — the same one `make` uses locally, so CI and the
      # maintainer's box run the identical toolchain. Deps are vendored.
      - name: Toolchain
        run: make toolchain
      - name: gofmt + go vet (linux + darwin)
        run: make lint
      - name: go test
        run: make test
      # The same tests under the race detector: the SSE stream, the silence
      # watchdog and the turn share state across goroutines.
      - name: go test -race
        run: make race
      # Per package: the unit tests' coverage, then what the golden runs (the
      # real REPL + --rpc) reach — shown on the run's summary page.
      - name: Coverage (job summary)
        run: |
          { echo '### Coverage'; echo '```'; make cover; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # The exact build release.yml runs after a merge (linux+darwin ×
      # amd64+arm64 + SHA256SUMS), minus the publish — so a green `test`
      # guarantees the release build will succeed and release.yml can skip
      # re-testing.
      - name: Build the release targets
        run: ./build.sh release
