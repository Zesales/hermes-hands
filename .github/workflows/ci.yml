name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2, pinned by commit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: install shellcheck + jq
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck jq
      - name: shellcheck
        run: shellcheck -x bin/hermes-hands lib/*.sh test/run_tests.sh
      - name: offline tests
        run: ./test/run_tests.sh
