name: codeql

# GitHub code scanning with CodeQL for the Go code: on every PR, on main after
# a merge (the baseline the PR results are compared with), and weekly — new
# queries find issues in old code too. Findings land in the repository's
# Security tab. (If "Code scanning: default setup" is on in the settings, turn
# it off — this workflow is the advanced setup and the two conflict.)
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC

permissions:
  contents: read
  security-events: write # upload the results
  actions: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CodeQL watches the build, so it needs a Go on the runner: go.mod's.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: go
          build-mode: manual
      - name: Build (vendored, offline)
        env:
          CGO_ENABLED: "0"
          GOFLAGS: -mod=vendor
        run: go build ./...
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
